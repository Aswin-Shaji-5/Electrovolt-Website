<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .payment-container{
            background:white;
            width:400px;
            padding:40px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            text-align:center;
        }

        .logo{
            font-size:32px;
            margin-bottom:15px;
        }

        h1{
            color:#222;
            margin-bottom:10px;
        }

        .amount{
            font-size:40px;
            color:#3399cc;
            font-weight:bold;
            margin:20px 0;
        }

        .description{
            color:#777;
            margin-bottom:30px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            background:#3399cc;
            color:white;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#287aa3;
        }

        .secure{
            margin-top:20px;
            color:green;
            font-size:14px;
        }

        .loader{
            display:none;
            margin-top:20px;
        }

        .spinner{
            width:35px;
            height:35px;
            border:4px solid #ddd;
            border-top:4px solid #3399cc;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:auto;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

    </style>
</head>
<body>

<div class="payment-container">

    <div class="logo">💳</div>

    <h1>Complete Payment</h1>

    <p class="description">
        Secure checkout powered by Razorpay
    </p>

    <div class="amount">
        ₹{{ total }}
    </div>

    <button id="pay-btn">
        Pay Now
    </button>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Opening payment gateway...</p>
    </div>

    <div class="secure">
        🔒 100% Secure Payment
    </div>

</div>

<script>

var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "ElectroVolt",
    "description": "Order Payment",
    "order_id": "{{ payment.id }}",

    "handler": function (response){

        window.location.href =
        "/orders/payment-success/?payment_id="
        + response.razorpay_payment_id
        + "&order_id="
        + response.razorpay_order_id
        + "&signature="
        + response.razorpay_signature;
    },

    "theme": {
        "color": "#3399cc"
    }
};

var rzp = new Razorpay(options);

document.getElementById("pay-btn").onclick = function(e){

    document.getElementById("loader").style.display = "block";

    rzp.open();

    e.preventDefault();
};

</script>

</body>
</html>

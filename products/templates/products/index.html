<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

{% extends 'base.html' %}

{% block content %}

<div style="padding:20px;">

    <!-- Page Title -->
    <h2 style="text-align:center;"> Welcome</h2>

    <!-- 🔍 Search Bar (Optional UI) -->
    <div style="text-align:center; margin:20px;">
        <form method="GET" action="">
            <input type="text" name="q" placeholder="Search products..."
                   style="padding:8px; width:250px;">
            <button type="submit" style="padding:8px;">Search</button>
        </form>
    </div>

    <!-- Product Section -->
    <div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center;">

        {% for product in products %}
        <div style="width:220px; border:1px solid #ddd; padding:15px; border-radius:10px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.1);">

            <!-- Product Image -->
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                     style="width:100%; height:180px; object-fit:cover; border-radius:8px;">
            {% else %}
                <p>No Image Available</p>
            {% endif %}

            <!-- Product Name -->
            <h3 style="margin:10px 0;">{{ product.name }}</h3>

            <!-- Price -->
            <p style="color:green; font-weight:bold;">₹{{ product.price }}</p>

            <!-- 🔗 Buttons -->
            <div style="margin-top:10px;">
                <a href="#" style="text-decoration:none; padding:6px 10px; background:blue; color:white; border-radius:5px;">View</a>
                <a href="#" style="text-decoration:none; padding:6px 10px; background:green; color:white; border-radius:5px;">Add to Cart</a>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

{% endblock %}
</body>
</html>
